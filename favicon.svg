<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SQL練習帳のアイコン: 青い角丸の地に、見出し行のある白い表（3列）。
       地の色があるので、ライト／ダークどちらのタブでも見える。16px でも形が分かるよう線は太め -->
  <rect width="32" height="32" rx="7" fill="#0969da"/>
  <rect x="5" y="6" width="22" height="20" rx="2.5" fill="#ffffff"/>
  <!-- 見出し行（淡い緑。アプリの「期待される結果」の色） -->
  <path d="M7.5 6h17A2.5 2.5 0 0 1 27 8.5V12H5V8.5A2.5 2.5 0 0 1 7.5 6z" fill="#4ac26b"/>
  <!-- 列と行の区切り -->
  <g stroke="#0969da" stroke-width="1.6">
    <path d="M12.3 12v14M19.7 12v14"/>
    <path d="M5 19h22"/>
  </g>
</svg>
